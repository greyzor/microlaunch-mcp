<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Microlaunch MCP preview host</title>
    <style>
      body { margin: 0; font: 14px system-ui, sans-serif; background: #f2f2f4; color: #111; }
      body.dark { background: #0e0e11; color: #eee; }
      header { display: flex; gap: 8px; align-items: center; padding: 10px 16px; flex-wrap: wrap; }
      main { display: grid; gap: 16px; padding: 0 16px 24px; max-width: 760px; }
      .frame { border-radius: 14px; overflow: hidden; border: 1px solid #0002; }
      iframe { width: 100%; border: 0; display: block; height: 200px; }
      #log { font: 12px ui-monospace, monospace; white-space: pre-wrap; opacity: .7; padding: 0 16px; }
    </style>
  </head>
  <body>
    <header>
      <select id="preset"></select>
      <button id="run">Run tool</button>
      <label><input type="checkbox" id="dark" /> dark</label>
      <label>width <input type="range" id="width" min="340" max="760" value="640" /></label>
    </header>
    <main id="frames"></main>
    <div id="log"></div>
    <script type="module" src="./host.ts"></script>
  </body>
</html>
